<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>歐大選擇權教室 - 內涵與時間價值特訓</title>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- jo-theme -->
    <script src="jo-theme.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --pop-yellow: #FFC62E;
            --pop-cyan: #7FD8EE;
            --pop-red: #D9321F;
            --pop-purple: #3A35C4;
            --pop-green: #0A7F4D;
        }

        body {
            font-family: 'PingFang TC', 'Microsoft JhengHei', 'Noto Sans TC', sans-serif;
            background-color: var(--pop-yellow);
            /* Ben-Day Dots 效果 */
            background-image: radial-gradient(#17142b 1.5px, transparent 0);
            background-size: 24px 24px;
            background-attachment: fixed;
            color: #17142b;
        }

        /* 震動與錯誤效果 */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
        .animate-shake { animation: shake 0.2s ease-in-out infinite; }

        .pop-card {
            box-shadow: 12px 12px 0px 0px rgba(23, 20, 43,1);
            border: 4px solid #000;
        }

        .btn-option {
            box-shadow: 6px 6px 0px 0px rgba(23, 20, 43,1);
            border: 3px solid #000;
            transition: all 0.1s;
        }
        .btn-option:active {
            transform: translate(3px, 3px);
            box-shadow: 3px 3px 0px 0px rgba(23, 20, 43,1);
        }

        /* 響應式流體設計 */
        .fluid-title { font-size: clamp(2rem, 8vw, 4.5rem); }
        .fluid-question { font-size: clamp(1.2rem, 4vw, 2.2rem); }
        .fluid-padding { padding: clamp(1rem, 5vw, 3.5rem); }
        .fluid-gap { gap: clamp(1rem, 3vw, 2rem); }

        /* 隱藏滾動條 */
        ::-webkit-scrollbar { width: 0px; background: transparent; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // SVG 圖示
        const IconLightning = () => <svg className="w-12 h-12" fill="currentColor" viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"></path></svg>;
        const IconCorrect = () => <svg className="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="3"><path d="M5 13l4 4L19 7"></path></svg>;
        const IconWrong = () => <svg className="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="3"><path d="M6 18L18 6M6 6l12 12"></path></svg>;

        const quizData = [
            // --- 內涵與時間價值 ---
            {
                q: "當台指站在 30,000 點時，歐大看到一個「30,200 的 Call」報價為 100 點，請問其內涵價值為多少？",
                options: ["100 點", "200 點", "0 點", "無法計算"],
                ans: 2,
                exp: "歐大解析：當現價(30,000)低於履約價(30,200)，這是一個價外 Call。既然無法即刻獲利，內涵價值即為 0，這 100 點全部都是時間價值。"
            },
            {
                q: "目前台指 30,000 點，一個「29,800 的 Call」報價為 350 點。請問其「時間價值」是多少？",
                options: ["350 點", "200 點", "150 點", "50 點"],
                ans: 2,
                exp: "歐大解析：內涵價值 = 現價(30,000) - 履約價(29,800) = 200 點。時間價值 = 權利金(350) - 內涵價值(200) = 150 點。"
            },
            {
                q: "台指選合約規格中，履約價間隔通常隨指數高低調整，目前 30,000 點附近的週選擇權間隔通常是？",
                options: ["10 點", "25 點", "50 點", "100 點"],
                ans: 2,
                exp: "歐大解析：隨著指數點數越高，權利金價值變動大，期交所為了交易靈活性，在指數高檔時近價位區間通常設定為 50 點。"
            },
            {
                q: "台指 30,000 點時，「29,500 的 Put」權利金報價 100 點，其內涵價值為？",
                options: ["500 點", "100 點", "0 點", "400 點"],
                ans: 2,
                exp: "歐大解析：Put 是賣出的權利。當現價(30,000)高於履約價(29,500)，代表目前履約反而是賠錢的(價外)，故內涵價值為 0。"
            },
            {
                q: "哪一種狀態的選擇權「時間價值」通常最高？",
                options: ["深度價內", "價平 (ATM) 附近", "深度價外", "都一樣"],
                ans: 1,
                exp: "歐大解析：價平附近因為未來漲跌最不確定，權利金中包含的「獲利希望(時間價值)」最多。"
            },
            {
                q: "深度價內 (Deep ITM) 的選擇權，其權利金主要由什麼組成？",
                options: ["全是時間價值", "全是內涵價值", "內涵價值為主，時間價值極低", "以上皆非"],
                ans: 2,
                exp: "歐大解析：深度價內因獲利已確定性高，時間價值反而較少，權利金變動幾乎與標的物同步。"
            },
            {
                q: "目前台指 30,000 點，歐大買入「30,000 點 Call」花費 250 點，若結算價為 30,100 點，內涵價值剩多少？",
                options: ["250 點", "100 點", "0 點", "150 點"],
                ans: 1,
                exp: "歐大解析：到期結算時時間價值歸零，僅剩內涵價值 = 結算價(30,100) - 履約價(30,000) = 100 點。"
            },
            {
                q: "當市場波動率 (IV) 突然暴增，權利金中的哪一部分會顯著上升？",
                options: ["內涵價值", "時間價值", "履約價格", "以上皆非"],
                ans: 1,
                exp: "歐大解析：波動率越高代表未來獲利機會增加，這會推升權利金中的時間價值（又稱外在價值）。"
            },
            {
                q: "台指 30,000 點，「30,500 點 Put」權利金 600 點。請問內涵價值是？",
                options: ["600 點", "500 點", "100 點", "0 點"],
                ans: 1,
                exp: "歐大解析：Put 履約價(30,500) > 現價(30,000) 為價內。內涵價值 = 30,500 - 30,000 = 500 點。"
            },
            {
                q: "到期日當天收盤前一秒，選擇權的價值幾乎只剩下？",
                options: ["時間價值", "內涵價值", "保證金", "希望"],
                ans: 1,
                exp: "歐大解析：到期時時間已耗盡，時間價值會歸零，權利金僅剩實務結算的實質獲利：內涵價值。"
            },
            // --- 時間流逝與 Theta ---
            {
                q: "在希臘字母中，專門用來衡量「時間價值衰減速度」的是？",
                options: ["Delta", "Gamma", "Theta", "Vega"],
                ans: 2,
                exp: "歐大解析：Theta 代表隨著時間經過(通常是一天)，選擇權權利金會流失多少價值。"
            },
            {
                q: "選擇權的時間價值衰減並非線性，請問在何時會呈現「斷崖式」的最劇烈衰減？",
                options: ["剛掛牌時", "到期前一個月", "行情大漲時", "瀕臨到期日（最後幾天）"],
                ans: 3,
                exp: "歐大解析：時間價值衰減曲線在早期較平緩，但在「瀕臨到期日」的最後階段，Theta 會呈斷崖式爆發，買方需極度小心！"
            },
            {
                q: "歐大提到的「融冰效應」，對以下哪一種身份最為不利？",
                options: ["選擇權買方", "選擇權賣方", "期貨交易者", "現貨持有者"],
                ans: 0,
                exp: "歐大解析：時間是買方的毒藥。指數只要不動，買方的錢就會天天變少，這就是融冰效應最殘酷的地方。"
            },
            {
                q: "對於選擇權「買方」而言，Theta 通常表現為？",
                options: ["正值 (賺錢)", "負值 (賠錢)", "0", "不一定"],
                ans: 1,
                exp: "歐大解析：買方持有權利，必須付出的代價就是時間天天流逝，所以 Theta 是負的，是買方的敵人。"
            },
            {
                q: "對於選擇權「賣方」而言，Theta 通常表現為？",
                options: ["正值 (賺錢)", "負值 (賠錢)", "0", "不一定"],
                ans: 0,
                exp: "歐大解析：賣方（莊家）最喜歡看著時間流逝，每天都能穩穩賺取權利金的自然衰減，Theta 是賣方的朋友。"
            },
            {
                q: "為什麼週末放假兩天，週一開盤權利金常會下跌？",
                options: ["因為有人偷賣", "因為兩天的時間價值流逝了", "因為股票跌了", "因為系統錯誤"],
                ans: 1,
                exp: "歐大解析：週末兩天雖然沒開盤，但到期日卻近了兩天，這就是 Theta 融冰效應在放假期間的展現。"
            },
            {
                q: "哪種狀態的選擇權 Theta (時間流失) 數值絕對值通常最高？",
                options: ["深度價外", "價平 (ATM) 附近", "深度價內", "都一樣"],
                ans: 1,
                exp: "歐大解析：價平位置包含的時間價值最高，因此在接近到期時，其流逝的絕對點數也最為驚人。"
            },
            {
                q: "若歐大想利用「時間價值的快速衰減」來獲利，他最適合扮演的角色是？",
                options: ["買方", "賣方 (收取時間價值)", "不參與", "買進股票"],
                ans: 1,
                exp: "歐大解析：在衰減最快（瀕臨到期）時擔任賣方，可以最快速賺取時間價值的消失，但需嚴控行情跳空的風險。"
            },
            {
                q: "關於選擇權的時間價值，以下描述何者正確？",
                options: ["時間價值永遠不會變", "越接近到期流逝越慢", "越接近到期流逝越快", "每天流失的點數都一樣"],
                ans: 2,
                exp: "歐大解析：時間流逝是加速度的！越靠近到期日，時間價值消失的速度就越快。"
            },
            {
                q: "歐大教室金句：在選擇權這場博弈中，如果你是買方，你是在跟什麼賽跑？",
                options: ["保證金", "手續費", "時間價值 (融冰效應)", "自己的影子"],
                ans: 2,
                exp: "歐大解析：買方是在跟時間賽跑。你不但要看對方向，還要在時間價值融化完之前跑得夠遠才行！"
            }
        ];

        function App() {
            const [currentQ, setCurrentQ] = useState(0);
            const [selected, setSelected] = useState(null);
            const [showExp, setShowExp] = useState(false);
            const [score, setScore] = useState(0);
            const [isWrong, setIsWrong] = useState(false);
            const [quizDone, setQuizDone] = useState(false);

            const handleAnswer = (idx) => {
                if (showExp) return;
                setSelected(idx);
                setShowExp(true);
                
                if (idx === quizData[currentQ].ans) {
                    setScore(prev => prev + 1);
                    setIsWrong(false);
                } else {
                    setIsWrong(true);
                    if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
                }
            };

            const next = () => {
                if (currentQ < quizData.length - 1) {
                    setCurrentQ(currentQ + 1);
                    setSelected(null);
                    setShowExp(false);
                    setIsWrong(false);
                } else {
                    setQuizDone(true);
                }
            };

            const reset = () => {
                setCurrentQ(0);
                setSelected(null);
                setShowExp(false);
                setScore(0);
                setIsWrong(false);
                setQuizDone(false);
            };

            const q = quizData[currentQ];

            return (
                <div className="min-h-screen flex items-center justify-center fluid-padding">
                    <div className="w-full max-w-4xl">
                        {/* 頂部標題 */}
                        <header className="mb-10 transform -rotate-1 transition-transform hover:rotate-0">
                            <div className="bg-[#7FD8EE] pop-card p-6 relative overflow-hidden">
                                <div className="absolute top-[-15px] right-[-15px] text-white opacity-20">
                                    <IconLightning />
                                </div>
                                <h1 className="fluid-title font-[900] italic uppercase tracking-tighter leading-none text-black">
                                    歐大選擇權教室
                                </h1>
                                <div className="flex gap-2 mt-3">
                                    <span className="bg-white text-black px-3 py-1 font-bold text-sm border-2 border-black">價值與時間特訓</span>
                                </div>
                            </div>
                        </header>

                        {!quizDone ? (
                            <main className={isWrong ? 'animate-shake' : ''}>
                                {/* 題目卡片 */}
                                <div className={`pop-card fluid-padding mb-8 transition-all duration-300 ${isWrong ? 'bg-[#D9321F]' : 'bg-white'}`}>
                                    <div className="flex justify-between items-center mb-6">
                                        <div className="flex items-center gap-2">
                                            <div className="bg-white border-2 border-black p-1 shadow-[3px_3px_0px_0px_rgba(0,0,0,1)]">
                                                <IconLightning />
                                            </div>
                                            <span className={`font-black text-sm uppercase tracking-widest ${isWrong ? 'text-white' : 'bg-black text-white px-2'}`}>
                                                QUESTION {currentQ + 1}
                                            </span>
                                        </div>
                                        <div className={`font-black text-2xl ${isWrong ? 'text-white' : 'text-black'}`}>
                                            {currentQ + 1} / {quizData.length}
                                        </div>
                                    </div>

                                    <h2 className={`fluid-question font-black leading-tight mb-10 ${isWrong ? 'text-white' : 'text-black'}`}>
                                        {q.q}
                                    </h2>

                                    <div className="grid grid-cols-1 gap-4">
                                        {q.options.map((opt, idx) => (
                                            <button
                                                key={idx}
                                                onClick={() => handleAnswer(idx)}
                                                disabled={showExp}
                                                className={`
                                                    btn-option text-left p-4 md:p-6 font-bold text-lg md:text-2xl flex items-center gap-5
                                                    ${showExp 
                                                        ? (idx === q.ans 
                                                            ? 'bg-[#0A7F4D] text-white scale-[1.02] z-10' 
                                                            : (selected === idx ? 'bg-black text-white border-white' : 'bg-gray-100 text-gray-400 border-gray-300 opacity-60'))
                                                        : 'bg-white text-black hover:bg-[#7FD8EE]'
                                                    }
                                                `}
                                            >
                                                <span className="shrink-0 w-10 h-10 border-4 border-black bg-[#FFC62E] flex items-center justify-center text-black font-black italic">
                                                    {String.fromCharCode(65 + idx)}
                                                </span>
                                                {opt}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                {/* 歐大解析區 */}
                                {showExp && (
                                    <div className="pop-card bg-[#3A35C4] fluid-padding animate-in fade-in slide-in-from-bottom-6 duration-500 mb-28 relative">
                                        <div className="absolute -top-6 left-10 bg-black text-white px-6 py-1 font-black skew-x-[-12deg] border-2 border-white shadow-[6px_6px_0px_0px_rgba(0,0,0,1)]">
                                            歐大點評：
                                        </div>
                                        <div className="flex flex-col md:flex-row items-center md:items-start gap-8">
                                            <div className="shrink-0 bg-white border-4 border-black p-4 rotate-3 shadow-[6px_6px_0px_0px_rgba(0,0,0,1)]">
                                                {selected === q.ans ? <IconCorrect className="text-[#0A7F4D]" /> : <IconWrong className="text-[#D9321F]" />}
                                            </div>
                                            <div className="flex-1 text-center md:text-left text-white">
                                                <p className="text-xl md:text-3xl font-black leading-tight mb-8 drop-shadow-[2px_2px_0px_rgba(0,0,0,0.5)]">
                                                    {q.exp}
                                                </p>
                                                <button
                                                    onClick={next}
                                                    className="w-full md:w-auto bg-black text-[#FFC62E] px-12 py-5 font-black text-2xl btn-option hover:bg-white hover:text-black uppercase italic tracking-widest"
                                                >
                                                    {currentQ === quizData.length - 1 ? "看總結 RESULT" : "下一題 NEXT"}
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                )}
                            </main>
                        ) : (
                            /* 完賽結算 */
                            <div className="pop-card bg-white p-10 text-center rotate-[1deg] mb-20">
                                <h2 className="text-4xl md:text-6xl font-black mb-8 uppercase italic tracking-tighter">特訓完成！</h2>
                                <div className="inline-block relative mb-10">
                                    <div className="absolute inset-0 bg-[#7FD8EE] translate-x-3 translate-y-3 border-4 border-black"></div>
                                    <div className="relative bg-white border-4 border-black px-12 py-8 text-8xl md:text-[10rem] font-black text-[#D9321F]">
                                        {Math.round((score / quizData.length) * 100)}<span className="text-4xl">%</span>
                                    </div>
                                </div>
                                <p className="text-2xl md:text-4xl font-black mb-12 leading-tight">
                                    你在 20 題中答對了 {score} 題！
                                    <br />
                                    <span className="bg-[#FFC62E] border-2 border-black px-6 mt-6 inline-block shadow-[8px_8px_0px_0px_rgba(0,0,0,1)] rotate-[-1deg]">
                                        {score === 20 ? "🚀 傳奇！歐大位子讓給你坐！" : (score >= 15 ? "🔥 強大！你對內涵價值非常熟悉！" : "🧘 再練練！融冰曲線還在等你！")}
                                    </span>
                                </p>
                                <button
                                    onClick={reset}
                                    className="flex items-center gap-4 mx-auto bg-black text-white px-14 py-6 font-black text-3xl btn-option hover:bg-[#7FD8EE] hover:text-black transition-colors"
                                >
                                    重新挑戰 RETRY
                                </button>
                            </div>
                        )}

                        {/* 底部進度條 */}
                        {!quizDone && (
                            <div className="fixed bottom-6 left-1/2 -translate-x-1/2 w-[90%] max-w-lg z-50">
                                <div className="flex items-center gap-4">
                                    <div className="flex-1 bg-white border-4 border-black h-10 shadow-[6px_6px_0px_0px_rgba(0,0,0,1)] relative overflow-hidden">
                                        <div 
                                            className="h-full bg-[#D9321F] transition-all duration-500 border-r-4 border-black" 
                                            style={{ width: `${(currentQ / quizData.length) * 100}%` }}
                                        ></div>
                                    </div>
                                    <div className="bg-black text-[#FFC62E] px-5 py-2 font-black border-2 border-white shadow-[6px_6px_0px_0px_rgba(0,0,0,1)] text-xl">
                                        {score}
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
