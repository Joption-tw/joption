<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>歐大選擇權教室 - 普普風卡通版</title>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- jo-theme -->
    <script src="jo-theme.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --pop-yellow: #FFC62E;
            --pop-cyan: #7FD8EE;
            --pop-red: #D9321F;
            --pop-purple: #3A35C4;
            --pop-green: #0A7F4D;
        }

        body {
            font-family: 'PingFang TC', 'Microsoft JhengHei', 'Noto Sans TC', sans-serif;
            background-color: var(--pop-yellow);
            /* Ben-Day Dots 效果 */
            background-image: radial-gradient(#17142b 1.5px, transparent 0);
            background-size: 24px 24px;
            background-attachment: fixed;
            color: #17142b;
        }

        /* 震動與錯誤效果 */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
        .animate-shake { animation: shake 0.2s ease-in-out infinite; }

        .pop-card {
            box-shadow: 12px 12px 0px 0px rgba(23, 20, 43,1);
            border: 4px solid #000;
        }

        .btn-option {
            box-shadow: 6px 6px 0px 0px rgba(23, 20, 43,1);
            border: 3px solid #000;
            transition: all 0.1s;
        }
        .btn-option:active {
            transform: translate(3px, 3px);
            box-shadow: 3px 3px 0px 0px rgba(23, 20, 43,1);
        }

        /* 響應式流體設計 */
        .fluid-title { font-size: clamp(2rem, 8vw, 4.5rem); }
        .fluid-question { font-size: clamp(1.2rem, 4vw, 2.2rem); }
        .fluid-padding { padding: clamp(1rem, 5vw, 3.5rem); }
        .fluid-gap { gap: clamp(1rem, 3vw, 2rem); }

        /* 隱藏滾動條 */
        ::-webkit-scrollbar { width: 0px; background: transparent; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // SVG 圖示
        const IconLightning = () => <svg className="w-12 h-12" fill="currentColor" viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"></path></svg>;
        const IconCorrect = () => <svg className="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="3"><path d="M5 13l4 4L19 7"></path></svg>;
        const IconWrong = () => <svg className="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="3"><path d="M6 18L18 6M6 6l12 12"></path></svg>;

        const quizData = [
            // --- 什麼是選擇權？ ---
            {
                q: "台指選來到 30,000 點大關，歐大想買進看漲權利，他支付給賣方的這筆對價稱為什麼？",
                options: ["保證金", "權利金", "結算價", "手續費"],
                ans: 1,
                exp: "歐大作為買方，支付的是「權利金」(Premium)。這筆錢是為了取得未來某個價格履約的權利，一旦支付後，歐大就擁有了權利而無義務。"
            },
            {
                q: "選擇權契約的「四要素」中，不包含下列哪一項？",
                options: ["標的物", "履約價", "到期日", "成交當日天氣"],
                ans: 3,
                exp: "選擇權四要素包含：標的物（如台指）、履約價格、到期時間以及權利金。天氣與合約規格無關。"
            },
            {
                q: "當台指為 30,000 點，歐大買入一個「履約價 30,200 的 Call」，這是一個什麼樣的權利？",
                options: ["買進的權利", "賣出的權利", "借款的權利", "收款的義務"],
                ans: 0,
                exp: "Call 代表「看漲選擇權」，也就是在到期時可以按履約價「買進」標的物的權利。"
            },
            {
                q: "如果歐大支付了 100 點權利金買入選擇權，換算成台幣是多少錢？（台指選一點 50 元）",
                options: ["1,000 元", "3,000 元", "5,000 元", "10,000 元"],
                ans: 2,
                exp: "台指選擇權一點價值 50 元。100 點 × 50 元 = 5,000 元台幣。"
            },
            // --- 權利與義務 ---
            {
                q: "在損益結構中，歐大作為「買方」，他的風險特徵是？",
                options: ["獲利有限，風險極大", "獲利無限，風險有限", "完全沒有風險", "風險與獲利完全相等"],
                ans: 1,
                exp: "買方的最大損失僅限於已支付的權利金，但若行情大幅波動，潛在獲利空間卻非常巨大。"
            },
            {
                q: "誰在選擇權交易中必須繳交「保證金」以確保履行義務？",
                options: ["買方", "賣方", "期交所", "不一定"],
                ans: 1,
                exp: "賣方收取了權利金，因此負有履行契約的「義務」。為了防止違約，賣方必須存入保證金作為擔保。"
            },
            {
                q: "歐大常說選擇權是「非線性」的工具，這代表買賣雙方的損益關係是？",
                options: ["對稱的", "不對稱的", "隨機的", "固定不變的"],
                ans: 1,
                exp: "選擇權具有「權利」與「義務」的分離特性，買方風險有限而賣方風險極大，兩者的風險結構是不對稱的。"
            },
            {
                q: "當台指大漲到 32,000 點，歐大持有的 30,000 Call 價值翻倍。這時「賣方」的處境是？",
                options: ["獲利翻倍", "損失有限", "面臨巨大虧損與追繳", "沒有受影響"],
                ans: 2,
                exp: "賣方的獲利上限僅為當初收到的權利金，但隨著指數噴出，賣方的損失會隨指數上漲而等比例放大，且面臨保證金追繳。"
            },
            // --- 獲利機率大解密 ---
            {
                q: "歐大觀察市場行情，通常有極高的比例處於「盤整」狀態，這個比例大約是？",
                options: ["10%", "30%", "50%", "70%~80%"],
                ans: 3,
                exp: "根據統計，市場約有 70% 至 80% 的時間處於橫盤整理。這對偏好賺取時間價值的賣方來說較為有利。"
            },
            {
                q: "選擇權的價值會隨著時間一天天過去而流逝，這種現象稱為什麼？",
                options: ["融冰效應", "利息效應", "通貨膨脹", "複利效果"],
                ans: 0,
                exp: "選擇權有到期日，隨著時間推移，合約的獲利希望會減少，價值會像冰塊融化一樣萎縮，稱為融冰效應（Theta 流逝）。"
            },
            {
                q: "歐大常說買方的勝率通常較低，主要是因為買方需要對抗哪一個敵人？",
                options: ["保證金", "手續費", "時間價值流逝", "期交所"],
                ans: 2,
                exp: "買方需要指數發生足夠大的波動來彌補支付的權利金，若行情只是小動或不動，權利金會隨時間流逝而損失。"
            },
            {
                q: "哪一種身份被稱為「莊家」，通常擁有較高的獲利機率但單次賠錢風險大？",
                options: ["買方", "賣方", "散戶", "政府"],
                ans: 1,
                exp: "賣方（莊家）透過賺取高比例盤整時間的權利金，通常勝率較高，但必須嚴格控管極端行情發生時的風險。"
            },
            // --- 深入實戰情境 (30,000點) ---
            {
                q: "台指 30,000 點，歐大 Buy Call 30,000 點並支付 200 點。結算在 30,100 點時，歐大的總損益為？",
                options: ["獲利 100 點", "虧損 100 點", "獲利 200 點", "損益兩平"],
                ans: 1,
                exp: "結算價值為 100 點 (30100 - 30000)，但扣除當初成本 200 點後，歐大實際上是虧損 100 點。"
            },
            {
                q: "承上題，歐大的「損益兩平點」在哪個價位？",
                options: ["30,000 點", "30,100 點", "30,200 點", "29,800 點"],
                ans: 2,
                exp: "買進看漲選擇權的兩平點 = 履約價 + 權利金。30,000 + 200 = 30,200 點。"
            },
            {
                q: "台指 30,000 點，歐大認為「不會跌破」29,500 點，他最適合操作哪種策略？",
                options: ["Buy Call", "Buy Put", "Sell Put", "Sell Call"],
                ans: 2,
                exp: "Sell Put 代表「看不跌」。只要指數結算在 29,500 點以上，歐大就能賺取全部的權利金。"
            },
            {
                q: "台指在 30,000 點時，30,500 點的 Call 被稱為什麼狀態？",
                options: ["價內", "價平", "價外", "超價內"],
                ans: 2,
                exp: "當前價格(30,000)低於履約價(30,500)，代表目前沒有履約價值，稱為「價外」(OTM)。"
            },
            {
                q: "台指在 30,000 點時，29,500 點的 Put 被稱為什麼狀態？",
                options: ["價內", "價平", "價外", "深度價外"],
                ans: 2,
                exp: "對 Put (看跌) 來說，履約價(29,500)低於現價(30,000)，代表目前也沒有履約價值（賣不到好價格），同樣是「價外」(OTM)。"
            },
            {
                q: "在到期前最後一天，權利金的時間價值歸零速度會？",
                options: ["變慢", "變快", "不變", "歸零後再回升"],
                ans: 1,
                exp: "隨著到期時間迫近，時間價值歸零速度會呈現指數型加速。最後一天的流逝是最劇烈的。"
            },
            {
                q: "若歐大想利用 30,000 點高檔盤整來獲利，他最適合站在哪一方？",
                options: ["買方", "賣方", "不參與交易", "現貨持有者"],
                ans: 1,
                exp: "當行情盤整不動時，賣方可以穩定收取時間價值（融冰）帶來的利潤。"
            },
            {
                q: "歐大給學員的最後金句：選擇權交易中最重要的是什麼？",
                options: ["只看獲利倍數", "理解機率與嚴控風險", "預測高低點", "追求 100% 勝率"],
                ans: 1,
                exp: "選擇權是一場機率與風險的博弈。理解「融冰」與「不對稱損益」，並設定好風險底線，才是長久生存之道。"
            }
        ];

        function App() {
            const [currentQ, setCurrentQ] = useState(0);
            const [selected, setSelected] = useState(null);
            const [showExp, setShowExp] = useState(false);
            const [score, setScore] = useState(0);
            const [isWrong, setIsWrong] = useState(false);
            const [quizDone, setQuizDone] = useState(false);

            const handleAnswer = (idx) => {
                if (showExp) return;
                setSelected(idx);
                setShowExp(true);
                
                if (idx === quizData[currentQ].ans) {
                    setScore(prev => prev + 1);
                    setIsWrong(false);
                } else {
                    setIsWrong(true);
                    if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
                }
            };

            const next = () => {
                if (currentQ < quizData.length - 1) {
                    setCurrentQ(currentQ + 1);
                    setSelected(null);
                    setShowExp(false);
                    setIsWrong(false);
                } else {
                    setQuizDone(true);
                }
            };

            const reset = () => {
                setCurrentQ(0);
                setSelected(null);
                setShowExp(false);
                setScore(0);
                setIsWrong(false);
                setQuizDone(false);
            };

            const q = quizData[currentQ];

            return (
                <div className="min-h-screen flex items-center justify-center fluid-padding">
                    <div className="w-full max-w-4xl">
                        {/* 頂部標題 */}
                        <header className="mb-10 transform -rotate-1 transition-transform hover:rotate-0">
                            <div className="bg-[#7FD8EE] pop-card p-6 relative overflow-hidden">
                                <div className="absolute top-[-15px] right-[-15px] text-white opacity-20">
                                    <IconLightning />
                                </div>
                                <h1 className="fluid-title font-[900] italic uppercase tracking-tighter leading-none text-black">
                                    歐大選擇權教室
                                </h1>
                                <div className="flex gap-2 mt-3">
                                    <span className="bg-white text-black px-3 py-1 font-bold text-sm border-2 border-black">必考 20 題</span>
                                </div>
                            </div>
                        </header>

                        {!quizDone ? (
                            <main className={isWrong ? 'animate-shake' : ''}>
                                {/* 題目卡片 */}
                                <div className={`pop-card fluid-padding mb-8 transition-all duration-300 ${isWrong ? 'bg-[#D9321F]' : 'bg-white'}`}>
                                    <div className="flex justify-between items-center mb-6">
                                        <div className="flex items-center gap-2">
                                            <div className="bg-white border-2 border-black p-1 shadow-[3px_3px_0px_0px_rgba(0,0,0,1)]">
                                                <IconLightning />
                                            </div>
                                            <span className={`font-black text-sm uppercase tracking-widest ${isWrong ? 'text-white' : 'bg-black text-white px-2'}`}>
                                                QUESTION {currentQ + 1}
                                            </span>
                                        </div>
                                        <div className={`font-black text-2xl ${isWrong ? 'text-white' : 'text-black'}`}>
                                            {currentQ + 1} / {quizData.length}
                                        </div>
                                    </div>

                                    <h2 className={`fluid-question font-black leading-tight mb-10 ${isWrong ? 'text-white' : 'text-black'}`}>
                                        {q.q}
                                    </h2>

                                    <div className="grid grid-cols-1 gap-4">
                                        {q.options.map((opt, idx) => (
                                            <button
                                                key={idx}
                                                onClick={() => handleAnswer(idx)}
                                                disabled={showExp}
                                                className={`
                                                    btn-option text-left p-4 md:p-6 font-bold text-lg md:text-2xl flex items-center gap-5
                                                    ${showExp 
                                                        ? (idx === q.ans 
                                                            ? 'bg-[#0A7F4D] text-white scale-[1.02] z-10' 
                                                            : (selected === idx ? 'bg-black text-white border-white' : 'bg-gray-100 text-gray-400 border-gray-300 opacity-60'))
                                                        : 'bg-white text-black hover:bg-[#7FD8EE]'
                                                    }
                                                `}
                                            >
                                                <span className="shrink-0 w-10 h-10 border-4 border-black bg-[#FFC62E] flex items-center justify-center text-black font-black italic">
                                                    {String.fromCharCode(65 + idx)}
                                                </span>
                                                {opt}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                {/* 歐大解析區 */}
                                {showExp && (
                                    <div className="pop-card bg-[#3A35C4] fluid-padding animate-in fade-in slide-in-from-bottom-6 duration-500 mb-28 relative">
                                        <div className="absolute -top-6 left-10 bg-black text-white px-6 py-1 font-black skew-x-[-12deg] border-2 border-white shadow-[6px_6px_0px_0px_rgba(0,0,0,1)]">
                                            歐大點評：
                                        </div>
                                        <div className="flex flex-col md:flex-row items-center md:items-start gap-8">
                                            <div className="shrink-0 bg-white border-4 border-black p-4 rotate-3 shadow-[6px_6px_0px_0px_rgba(0,0,0,1)]">
                                                {selected === q.ans ? <IconCorrect className="text-[#0A7F4D]" /> : <IconWrong className="text-[#D9321F]" />}
                                            </div>
                                            <div className="flex-1 text-center md:text-left text-white">
                                                <p className="text-xl md:text-3xl font-black leading-tight mb-8 drop-shadow-[2px_2px_0px_rgba(0,0,0,0.5)]">
                                                    {q.exp}
                                                </p>
                                                <button
                                                    onClick={next}
                                                    className="w-full md:w-auto bg-black text-[#FFC62E] px-12 py-5 font-black text-2xl btn-option hover:bg-white hover:text-black uppercase italic tracking-widest"
                                                >
                                                    {currentQ === quizData.length - 1 ? "看總結 RESULT" : "下一題 NEXT"}
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                )}
                            </main>
                        ) : (
                            /* 完賽結算 */
                            <div className="pop-card bg-white p-10 text-center rotate-[1deg] mb-20">
                                <h2 className="text-4xl md:text-6xl font-black mb-8 uppercase italic tracking-tighter">特訓完成！</h2>
                                <div className="inline-block relative mb-10">
                                    <div className="absolute inset-0 bg-[#7FD8EE] translate-x-3 translate-y-3 border-4 border-black"></div>
                                    <div className="relative bg-white border-4 border-black px-12 py-8 text-8xl md:text-[10rem] font-black text-[#D9321F]">
                                        {Math.round((score / quizData.length) * 100)}<span className="text-4xl">%</span>
                                    </div>
                                </div>
                                <p className="text-2xl md:text-4xl font-black mb-12 leading-tight">
                                    你在 20 題中答對了 {score} 題！
                                    <br />
                                    <span className="bg-[#FFC62E] border-2 border-black px-6 mt-6 inline-block shadow-[8px_8px_0px_0px_rgba(0,0,0,1)] rotate-[-1deg]">
                                        {score === 20 ? "🚀 傳奇！歐大位子讓給你坐！" : (score >= 15 ? "🔥 強大！你已經掌握致富密碼！" : "🧘 再練練！融冰效應在等你！")}
                                    </span>
                                </p>
                                <button
                                    onClick={reset}
                                    className="flex items-center gap-4 mx-auto bg-black text-white px-14 py-6 font-black text-3xl btn-option hover:bg-[#7FD8EE] hover:text-black transition-colors"
                                >
                                    重新挑戰 RETRY
                                </button>
                            </div>
                        )}

                        {/* 底部進度條 */}
                        {!quizDone && (
                            <div className="fixed bottom-6 left-1/2 -translate-x-1/2 w-[90%] max-w-lg z-50">
                                <div className="flex items-center gap-4">
                                    <div className="flex-1 bg-white border-4 border-black h-10 shadow-[6px_6px_0px_0px_rgba(0,0,0,1)] relative overflow-hidden">
                                        <div 
                                            className="h-full bg-[#D9321F] transition-all duration-500 border-r-4 border-black" 
                                            style={{ width: `${(currentQ / quizData.length) * 100}%` }}
                                        ></div>
                                    </div>
                                    <div className="bg-black text-[#FFC62E] px-5 py-2 font-black border-2 border-white shadow-[6px_6px_0px_0px_rgba(0,0,0,1)] text-xl">
                                        {score}
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
