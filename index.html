<html lang="zh-TW">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/htm@3/dist/htm.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lilita+One&family=Noto+Sans+TC:wght@400;700;900&display=swap');

        /* Joption 品牌風格（跟官網 joption-site/theme/site.css 同一套）：金幣黃 + 天藍 + 靛藍，粗黑描邊加硬陰影 */
        :root {
            --coin: #ffc62e;
            --coin-deep: #f0a30a;
            --sky: #cff3fb;
            --sky-deep: #7fd8ee;
            --indigo: #3a35c4;
            --indigo-deep: #241f86;
            --ink: #17142b;
            --muted: #5c5870;
            --paper: #fffcf5;
            --kraft: #fff1da;
            --call: #d9321f;
            --put: #0a7f4d;
            --edge: 2.5px solid var(--ink);
            --pop: 4px 4px 0 var(--ink);
            --pop-big: 6px 6px 0 var(--ink);
            --display: "Lilita One", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
            --hatch: repeating-linear-gradient(115deg, rgba(58, 53, 196, .11) 0 2px, transparent 2px 10px);
        }

        html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; background: var(--paper); }
        body {
            font-family: "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", system-ui, sans-serif;
            color: var(--ink);
            -webkit-tap-highlight-color: transparent;
        }
        button { font-family: inherit; }
        :focus-visible { outline: 3px solid var(--indigo); outline-offset: 2px; }

        .animate-fade-in { animation: fadeIn .4s cubic-bezier(.4, 0, .2, 1) forwards; opacity: 0; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
        @keyframes spin { to { transform: rotate(360deg); } }

        .submenu-enter { max-height: 0; overflow: hidden; opacity: 0; transition: max-height .4s cubic-bezier(.4, 0, .2, 1), opacity .25s ease; }
        .submenu-open { max-height: 1500px; opacity: 1; }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #d9c9ab; border-radius: 10px; }

        .scroll-container { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; scroll-behavior: smooth; background: var(--paper); }
        .iframe-container { flex: 1; width: 100%; height: 100%; overflow: hidden; position: relative; }
        .iframe-container iframe { display: block; width: 100%; height: 100%; border: none; }

        /* 頂列：跟官網一樣的金幣黃 */
        .jo-topbar {
            flex: none; position: relative; z-index: 60;
            display: flex; align-items: center; gap: 12px;
            height: 60px; padding: 0 16px;
            background: var(--coin); border-bottom: 3px solid var(--ink);
        }
        .jo-brand {
            display: flex; align-items: center; gap: 8px; padding: 0; border: 0; background: none; cursor: pointer;
            font-family: var(--display); font-size: 18px; color: var(--ink); white-space: nowrap; letter-spacing: .02em;
        }
        .jo-brand img { flex: none; width: 40px; height: 40px; object-fit: contain; }
        .jo-brand small { font-size: 13px; color: var(--indigo-deep); letter-spacing: .08em; margin-left: 2px; }
        .jo-menu-btn {
            flex: none; width: 42px; height: 42px; padding: 10px 9px;
            background: #fff; border: var(--edge); border-radius: 10px; box-shadow: 2px 2px 0 var(--ink); cursor: pointer;
        }
        .jo-menu-btn span { display: block; height: 3px; margin: 3px 0; background: var(--ink); border-radius: 2px; }
        .jo-menu-btn:active { transform: translate(2px, 2px); box-shadow: none; }
        .jo-top-link {
            margin-left: auto; padding: 6px 16px; border: var(--edge); border-radius: 999px;
            background: #fff; box-shadow: 2px 2px 0 var(--ink);
            font-weight: 900; font-size: 14px; color: var(--ink); text-decoration: none; white-space: nowrap;
        }
        .jo-top-link:hover { background: var(--sky); }
        .jo-top-link:active { transform: translate(2px, 2px); box-shadow: none; }

        /* 側邊選單：牛皮紙底，現在這章是靛藍貼紙 */
        .jo-side {
            flex: none; width: 290px; overflow-y: auto; padding: 18px 10px 40px;
            background: var(--kraft); border-right: 3px solid var(--ink);
            font-size: 15px; line-height: 1.45;
        }
        .jo-ch {
            width: 100%; display: flex; align-items: center; gap: 10px; padding: 9px 10px;
            border: 2px solid transparent; border-radius: 8px; background: none; cursor: pointer; text-align: left;
            color: var(--indigo-deep); font-weight: 900; font-size: 16px;
        }
        .jo-ch:hover { background: var(--coin); }
        .jo-ch.is-active { background: var(--indigo); color: #fff; border-color: var(--ink); box-shadow: 2px 2px 0 var(--ink); }
        .jo-ch .chev { margin-left: auto; flex: none; transition: transform .2s; }
        .jo-ch.is-active .chev { transform: rotate(180deg); }
        .jo-subs { margin: 4px 0 10px 18px; padding-left: 8px; border-left: 2px dashed #d9c9ab; }
        .jo-sub {
            width: 100%; display: flex; align-items: center; gap: 6px; padding: 7px 10px;
            border: 0; border-radius: 8px; background: none; cursor: pointer; text-align: left;
            color: var(--ink); font-size: 14.5px;
        }
        .jo-sub:hover { background: var(--coin); }
        .jo-sub.is-active { background: var(--sky-deep); box-shadow: inset 0 0 0 2px var(--ink); font-weight: 700; }
        .jo-sub-test { color: var(--indigo); font-weight: 700; }
        .jo-sub-test.is-active { background: var(--coin); color: var(--ink); }

        /* 首頁大圖：天藍斜線底、雙賣損益圖當底邊 */
        .jo-hero { position: relative; overflow: hidden; background: var(--hatch), var(--sky); border: 3px solid var(--ink); border-radius: 22px; box-shadow: var(--pop-big); }
        .jo-hero-inner { position: relative; z-index: 1; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 330px); align-items: center; gap: 20px; padding: 36px 44px 104px; }
        .jo-kicker { margin: 0 0 10px; font-size: 15px; font-weight: 700; color: var(--indigo-deep); letter-spacing: .08em; }
        .jo-hero-title { margin: 0; font-family: var(--display); font-weight: 900; font-size: clamp(26px, 3.4vw, 40px); line-height: 1.3; word-break: keep-all; }
        .jo-hero-title b { display: block; font-weight: 400; font-size: 1.4em; line-height: 1.15; color: var(--indigo); text-shadow: 3px 3px 0 var(--coin); letter-spacing: .02em; }
        .jo-hero-lead { margin: 16px 0 24px; font-size: 17px; line-height: 1.75; max-width: 34em; }
        .jo-hero-art { position: relative; }
        .jo-hero-art::before { content: ""; position: absolute; inset: 6%; border-radius: 50%; background: var(--coin); border: 3px solid var(--ink); box-shadow: var(--pop-big); }
        .jo-hero-art img { position: relative; display: block; width: 100%; height: auto; }
        .payoff { position: absolute; left: 0; right: 0; bottom: -1px; width: 100%; height: 84px; display: block; }
        .payoff-fill { fill: var(--paper); }
        .payoff-line { fill: none; stroke: var(--ink); stroke-width: 4; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
        .payoff-tag { position: absolute; z-index: 2; padding: 1px 12px; border: 2px solid var(--ink); border-radius: 999px; font-family: var(--display); font-size: 15px; line-height: 1.5; color: #fff; white-space: nowrap; box-shadow: 2px 2px 0 var(--ink); }
        .payoff-tag.put { left: 13%; bottom: 40px; background: var(--put); transform: rotate(-6deg); }
        .payoff-tag.call { right: 13%; bottom: 40px; background: var(--call); transform: rotate(6deg); }
        .payoff-tag.theta { left: 50%; bottom: 66px; background: var(--coin); color: var(--ink); transform: translateX(-50%); }

        .jo-btn {
            display: inline-flex; align-items: center; gap: 10px; padding: 12px 26px;
            border: var(--edge); border-radius: 999px; box-shadow: var(--pop); cursor: pointer;
            font-weight: 900; font-size: 18px; color: var(--ink); text-decoration: none;
            transition: transform .12s, box-shadow .12s;
        }
        .jo-btn:hover { transform: translate(-2px, -2px); box-shadow: var(--pop-big); }
        .jo-btn:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--ink); }
        .jo-btn-coin { background: var(--coin); }
        .jo-btn-indigo { background: var(--indigo); color: #fff; font-size: 16px; padding: 10px 22px; }

        .jo-panel { background: #fff; border: var(--edge); border-radius: 22px; box-shadow: var(--pop-big); padding: 32px 36px; }
        .jo-h2 { margin: 0; font-family: var(--display); font-weight: 900; font-size: clamp(22px, 2.8vw, 32px); line-height: 1.35; }
        .jo-h2 span { display: block; color: var(--indigo); }
        .jo-lead { margin: 10px 0 18px; color: var(--muted); font-size: 16px; line-height: 1.7; }

        /* 卡片：跟官網首頁卡片一樣黃、藍、靛藍輪流 */
        .jo-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 16px; margin-top: 26px; }
        .jo-card {
            display: block; padding: 16px 18px; border: var(--edge); border-radius: 14px; box-shadow: var(--pop);
            background: #fff; color: var(--ink); text-decoration: none; text-align: left; cursor: pointer;
            transition: transform .12s, box-shadow .12s;
        }
        .jo-card:hover { transform: translate(-2px, -2px); box-shadow: var(--pop-big); }
        .jo-card:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--ink); }
        .jo-card:nth-child(5n+1) { background: var(--coin); }
        .jo-card:nth-child(5n+2) { background: var(--sky-deep); }
        .jo-card:nth-child(5n+3) { background: var(--indigo); color: #fff; }
        .jo-card:nth-child(5n+4) { background: var(--kraft); }
        .jo-card .emoji { display: block; font-size: 30px; line-height: 1; transition: transform .15s; }
        .jo-card:hover .emoji { transform: rotate(-10deg) scale(1.08); }
        .jo-card h4 { margin: 10px 0 0; font-size: 17px; font-weight: 900; line-height: 1.4; }
        .jo-card p { margin: 6px 0 0; font-size: 14px; line-height: 1.55; opacity: .85; }

        .jo-visits { display: flex; justify-content: center; flex-wrap: wrap; gap: 14px; }
        .jo-visit { min-width: 150px; padding: 10px 18px; border: var(--edge); border-radius: 14px; box-shadow: var(--pop); background: #fff; text-align: center; }
        .jo-visit:nth-child(1) { background: var(--coin); }
        .jo-visit:nth-child(2) { background: var(--sky); }
        .jo-visit b { display: block; font-family: var(--display); font-weight: 400; font-size: 30px; line-height: 1.15; color: var(--indigo); }
        .jo-visit span { font-size: 14px; font-weight: 700; }
        .jo-foot { margin: 0; font-family: var(--display); font-size: 13px; letter-spacing: .15em; color: var(--muted); text-align: center; }

        /* 章節頁：課程按鈕是白色貼紙，測驗是金幣黃 */
        .jo-chapter { max-width: 1040px; margin: 0 auto; width: 100%; }
        .jo-tag { display: inline-block; padding: 2px 14px; border: var(--edge); border-radius: 999px; background: var(--coin); box-shadow: 2px 2px 0 var(--ink); font-family: var(--display); font-size: 14px; letter-spacing: .1em; }
        .jo-chapter-title { margin: 16px 0 28px; font-family: var(--display); font-weight: 900; font-size: clamp(26px, 3.4vw, 40px); line-height: 1.25; }
        .jo-lessons { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; }
        .jo-lesson {
            display: flex; align-items: center; gap: 14px; padding: 14px 16px;
            border: var(--edge); border-radius: 14px; box-shadow: var(--pop); background: #fff; cursor: pointer; text-align: left;
            color: var(--ink); font-size: 16px; font-weight: 900; line-height: 1.4;
            transition: transform .12s, box-shadow .12s;
        }
        .jo-lesson:hover { transform: translate(-2px, -2px); box-shadow: var(--pop-big); background: var(--sky); }
        .jo-lesson:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--ink); }
        .jo-lesson .num { flex: none; display: grid; place-items: center; width: 40px; height: 40px; border: var(--edge); border-radius: 50%; background: var(--sky); font-family: var(--display); font-weight: 400; font-size: 18px; }
        .jo-lesson:hover .num { background: #fff; }
        .jo-lesson-test { background: var(--coin); }
        .jo-lesson-test:hover { background: var(--coin-deep); }
        .jo-lesson-test .num { background: #fff; }

        @media (min-width: 768px) { .jo-menu-btn { display: none; } }
        @media (max-width: 767px) {
            .jo-side { position: fixed; top: 60px; bottom: 0; left: 0; z-index: 50; width: 280px; transform: translateX(-102%); transition: transform .25s ease; }
            .jo-side.open { transform: none; }
            .jo-brand { font-size: 16px; }
            .jo-brand small { display: none; }
            .jo-top-link { padding: 5px 12px; font-size: 13px; }
            .jo-hero-inner { grid-template-columns: 1fr; text-align: center; padding: 26px 20px 96px; gap: 8px; }
            .jo-hero-art { order: -1; width: min(60vw, 230px); margin: 0 auto 6px; }
            .jo-hero-lead { margin-left: auto; margin-right: auto; font-size: 16px; }
            .payoff { height: 70px; }
            .payoff-tag { font-size: 13px; }
            .payoff-tag.put { left: 6%; bottom: 30px; }
            .payoff-tag.call { right: 6%; bottom: 30px; }
            .payoff-tag.theta { bottom: 54px; }
            .jo-panel { padding: 22px 18px; }
            .jo-cards { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
            .jo-card { padding: 14px; }
            .jo-card:last-child:nth-child(odd) { grid-column: 1 / -1; }
        }
        @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation-duration: 0s !important; } }
    </style>
</head>
<body>
    <div id="root" class="h-full">
        <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;background:#fffcf5;gap:16px;">
            <div style="width:48px;height:48px;border:5px solid #cff3fb;border-top-color:#3a35c4;border-radius:50%;animation:spin 0.8s linear infinite;"></div>
            <p style="font-family:'Noto Sans TC',sans-serif;font-size:1rem;color:#5c5870;margin:0;">載入中，請稍候…</p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot, increment, serverTimestamp, collection } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        window.FirebaseSDK = { initializeApp, getAuth, signInAnonymously, onAuthStateChanged, getFirestore, doc, setDoc, onSnapshot, increment, serverTimestamp, collection };
    </script>

    <script>
        const html = htm.bind(React.createElement);
        const { useState, useEffect, useMemo, useRef } = React;

        const Icons = {
            Home:            () => html`<svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>`,
            Book:            () => html`<svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>`,
            Target:          () => html`<svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`,
            TrendingUp:      () => html`<svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path></svg>`,
            Shield:          () => html`<svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>`,
            Zap:             () => html`<svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>`,
            Code:            () => html`<svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"></path></svg>`,
            Terminal:        () => html`<svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>`,
            ChevronDown:     () => html`<svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M19 9l-7 7-7-7"></path></svg>`,
            Menu:            () => html`<svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M4 6h16M4 12h16M4 18h16"></path></svg>`,
            X:               () => html`<svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M6 18L18 6M6 6l12 12"></path></svg>`,
            ClipboardCheck:  () => html`<svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path></svg>`,
            Leaf:            () => html`<svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M4 11a9 9 0 019 9M4 11a9 9 0 019-9m-9 9l9 9m0-18l-9 9"></path></svg>`,
            ArrowRight:      () => html`<svg className="w-5 h-5 transition-transform group-hover:translate-x-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>`,
            Users:           () => html`<svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>`,
            Clock:           () => html`<svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`,
            MessageQuestion: () => html`<svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`
        };

        const App = () => {
            const [activeChapterId, setActiveChapterId] = useState('home');
            const [activeSubIndex, setActiveSubIndex]   = useState(null);
            const [isMenuOpen, setIsMenuOpen]           = useState(false);
            const [visitorStats, setVisitorStats]       = useState({ total: null, daily: null });

            const hasIncrementedRef = useRef(false);
