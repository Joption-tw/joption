<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>歐大選擇權教室 - 生存特訓 30題</title>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- jo-theme -->
    <script src="jo-theme.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --pop-bg: #F0A30A;      /* 熱力橘 */
            --pop-header: #7FD8EE;  /* 天藍（品牌色） */
            --pop-card: #FFFFFF;    
            --pop-btn: #FFC62E;     /* 亮黃 */
            --pop-red: #D9321F;     
            --pop-purple: #3A35C4;  
        }

        body {
            font-family: 'PingFang TC', 'Microsoft JhengHei', 'Noto Sans TC', sans-serif;
            background-color: var(--pop-bg);
            background-image: radial-gradient(#17142b 2.5px, transparent 0);
            background-size: 30px 30px;
            background-attachment: fixed;
            color: #17142b;
            transition: background-color 0.8s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-12px); }
            75% { transform: translateX(12px); }
        }
        .animate-shake { animation: shake 0.2s ease-in-out infinite; }

        .pop-card {
            box-shadow: 15px 15px 0px 0px rgba(23, 20, 43,1);
            border: 6px solid #000;
        }

        .btn-option-pill {
            box-shadow: 8px 8px 0px 0px rgba(23, 20, 43,1);
            border: 4px solid #000;
            border-radius: 9999px;
            transition: all 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .btn-option-pill:active {
            transform: translate(4px, 4px);
            box-shadow: 4px 4px 0px 0px rgba(23, 20, 43,1);
        }

        .fluid-title { font-size: clamp(1.8rem, 6vw, 3.5rem); }
        .fluid-question { font-size: clamp(1.1rem, 3.5vw, 1.8rem); }
        .fluid-padding { padding: clamp(1rem, 5vw, 3rem); }

        ::-webkit-scrollbar { width: 0px; background: transparent; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const IconZap = () => <svg className="w-12 h-12" fill="currentColor" viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"></path></svg>;
        const IconCheck = () => <svg className="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="4"><path d="M5 13l4 4L19 7"></path></svg>;
        const IconX = () => <svg className="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="4"><path d="M6 18L18 6M6 6l12 12"></path></svg>;

        const quizData = [
            // --- 6-1: 保證金與規格 ---
            { cat: "保證金計算", q: "歐大想賣出一個 Call，期交所公式中的「A值」主要代表什麼意義？", options: ["權利金價值", "指數波動風險值", "固定手續費", "履約價點數"], ans: 1, exp: "歐大點評：A值是期交所設定的風險基準額。賣方必須準備充足的 A 值保證金，以應對標的物劇烈波動的風險。" },
            { cat: "保證金計算", q: "當歐大賣出「價外(OTM)」選擇權時，計算公式中的「B值」發揮什麼作用？", options: ["增加獲利", "依價外程度調減保證金", "計算交易稅", "固定賠償金"], ans: 1, exp: "歐大點評：價外部位履行義務的可能性較低，B 值會適度調減賣方保證金，但設有最低地板限額。" },
            { cat: "保證金計算", q: "合約規格中，指數高檔區間的「週選擇權」近價平履約價間隔通常是？", options: ["10 點", "25 點", "50 點", "100 點"], ans: 2, exp: "歐大點評：為了讓交易更精準與靈活，目前高檔區間的週選擇權履約價間隔設定為 50 點。" },
            { cat: "保證金計算", q: "歐大建立了一組「雙賣組合策略(賣C+賣P)」，保證金會如何收取？", options: ["兩邊各收一次", "只收保證金較高的一邊加另一邊權利金", "完全不需保證金", "由期交所隨機決定"], ans: 1, exp: "歐大點評：雙賣組合具有互補性。期交所通常採取「收取保證金較高的一方加上另一方的權利金市值」來優化資金效率。" },
            { cat: "保證金計算", q: "當行情跳動劇烈，導致賣方的「維持保證金」不足時會發生什麼？", options: ["自動轉倉", "收到追繳通知(Margin Call)", "稅金優待", "部位自動獲利"], ans: 1, exp: "歐大點評：權益數低於維持線就會收到追繳。若不及時補足或平倉，將面臨強制沖銷（斷頭）風險。" },
            { cat: "保證金計算", q: "歐大執行「多頭價差策略(買低賣高C)」，此組合的保證金特性為何？", options: ["風險無限", "風險有限，僅需準備最大虧損點數", "不需任何成本", "比單邊買進更貴"], ans: 1, exp: "歐大點評：價差組合因買方部位鎖死風險，所需保證金遠低於單邊賣方，僅需負擔兩履約價差額的風險點數。" },
            { cat: "保證金計算", q: "若歐大賣出的選擇權「極度價外」，保證金最低下限是由哪一個數值決定的？", options: ["A 值", "B 值", "C 值", "D 值"], ans: 2, exp: "歐大點評：C 值是保證金的地板價。即使再怎麼價外，賣方仍須存入基本保證金以應對極端的跳空風險。" },

            // --- 6-2: 歐式結算風格 ---
            { cat: "歐式 vs 美式", q: "台灣台指選擇權 (TXO) 是屬於哪一種結算風格？", options: ["美式 (隨時可行權)", "歐式 (到期才行權)", "亞式 (看全天平均)", "中式"], ans: 1, exp: "歐大點評：台灣 TXO 是歐式風格。這代表買方不能在中途要求換取現貨，只能平倉或等待週三結算。" },
            { cat: "歐式 vs 美式", q: "台指選擇權在結算當天，最後結算價是如何產生的？", options: ["13:25 最後一筆", "開盤價", "13:00~13:30 簡單算術平均價", "當日最高價"], ans: 2, exp: "歐大點評：採最後 30 分鐘平均價，是為了防止大戶在最後一秒刻意操縱價格，讓結算更公平。" },
            { cat: "歐式 vs 美式", q: "歐大持有「價內(ITM)」部位直到結算結束，他必須做什麼？", options: ["手動申請履約", "不需要，系統會自動現金結算", "去交易所簽名", "打電話給歐大"], ans: 1, exp: "歐大點評：TXO 採現金結算。只要到期時具備實質價值，差額會自動撥入或從帳戶扣除，不需手動操作。" },
            { cat: "歐式 vs 美式", q: "美式選擇權（如美股選擇權）與歐式最大的差別是什麼？", options: ["顏色不同", "買方可以在到期前任何時間要求行權", "手續費較低", "不看波動率"], ans: 1, exp: "歐大點評：美式賦予買方「提前行權」的權力，這會讓賣方隨時面臨被指派履約的壓力。" },
            { cat: "歐式 vs 美式", q: "台灣週選擇權的最後交易日與結算日，通常是星期幾？", options: ["星期一", "星期三", "星期四", "星期六"], ans: 1, exp: "歐大點評：週選擇權固定在每週三進行結算，這是選擇權玩家每週最重要的「開獎」時刻。" },
            { cat: "歐式 vs 美式", q: "關於選擇權的時間價值衰減，通常在什麼時候會呈現「加速」狀態？", options: ["剛掛牌時", "到期日前 30 天", "瀕臨到期日(最後階段)", "行情不動時"], ans: 2, exp: "歐大點評：Theta 衰減是非線性的。越「瀕臨到期日」，權利金中的時間價值消失速度就會越快，對買方極其殘酷。" },
            { cat: "歐式 vs 美式", q: "在結算日 13:00 之後，市場常有異常震盪，歐大認為主要原因是？", options: ["系統故障", "法人與大戶在博弈平均結算價", "手續費減半", "大家想收工"], ans: 1, exp: "歐大點評：13:00~13:30 是計算平均價的博弈期，各方力量在此時進行避險或轉倉，導致行情波濤洶湧。" },

            // --- 6-3: 10 個交易地雷 ---
            { cat: "10 個交易地雷", q: "歐大警告：什麼是「IV Crush」波動率地雷？", options: ["指數暴跌", "重大事件公佈後隱含波動率崩潰", "交易稅提高", "電腦中毒"], ans: 1, exp: "歐大點評：當大選或法說會結束，不確定性消失，IV 會瞬間從雲端掉到地平線，買方即使方向看對也會慘賠。" },
            { cat: "10 個交易地雷", q: "結算日當天的「Gamma 怪物」地雷，對哪一方最危險？", options: ["買方", "裸賣方 (Naked Seller)", "只做現貨的人", "都不危險"], ans: 1, exp: "歐大點評：結算日 Gamma 極大。指数稍微一動，賣方的虧損就會呈幾何級數放大，甚至瞬間爆倉。" },
            { cat: "10 個交易地雷", q: "歐大提到的「流動性地雷」主要指什麼狀況？", options: ["成交太快", "買賣價差(Spread)極大，進得去出不來", "戶頭現金太多", "網路頻寬不足"], ans: 1, exp: "歐大點評：在冷門履約價或夜盤，買賣點差可能高達數十點。若強行市價平倉，你的利潤會被點差瞬間吃光。" },
            { cat: "10 個交易地雷", q: "關於「夜盤與跳空風險」，歐大建議新手應警惕？", options: ["夜盤不開燈", "長假期間國際崩盤，開盤直接跳空大賠", "手續費加倍", "夜盤不能結算"], ans: 1, exp: "歐大點評：賣方最怕隔夜跳空。若在國際盤劇震時重倉過夜，台股一開盤的跳空缺口可能讓你連停損的機會都沒有。" },
            { cat: "10 個交易地雷", q: "為什麼在行情劇烈跳動（快市）時，千萬不要使用「市價單」？", options: ["成交太慢", "會成交在離譜的掛單價，造成巨大虧損", "手續費會變貴", "歐大不喜歡"], ans: 1, exp: "歐大點評：快市時價差會瞬間拉開。市價單會去掃描最遠的掛單，導致你成交在不可思議的賠錢價。請永遠使用「限價單」。" },
            { cat: "10 個交易地雷", q: "新手常犯的「追高買入深價外(OTM)」地雷，其真相為何？", options: ["獲利機率極大", "結算成功率極低，純屬送錢給莊家", "保本穩健", "這是進階技術"], ans: 1, exp: "歐大點評：深價外部位雖然看起來很便宜，但結算成功的機率微乎其微。重複操作這種策略，本金很快就會歸零。" },
            { cat: "10 個交易地雷", q: "「過度槓桿」地雷通常發生在哪種行為？", options: ["多頭價差", "滿倉裸賣方且不留剩餘保證金", "定期定額", "買入價平部位"], ans: 1, exp: "歐大點評：只要行情一次「意外」的劇烈跳動，過度槓桿的部位就會觸發斷頭，讓你徹底從市場畢業。" },
            { cat: "10 個交易地雷", q: "在行情冷淡盤整時，買方(Buyer)面臨的最直接威脅是？", options: ["IV 上升", "Theta 時間吸血", "Gamma 爆發", "手續費降低"], ans: 1, exp: "歐大點評：盤整是買方的天敵。即使指數沒跌，你的權利金也會因為時間流逝天天「融冰」。" },

            // --- 6-4: 新手生存手冊 ---
            { cat: "新手生存手冊", q: "台指選擇權的「夜盤（盤後交易）」時間從下午三點戰到凌晨幾點？", options: ["24:00", "03:00", "05:00", "不休息"], ans: 2, exp: "歐大點評：夜盤打到凌晨五點。這是觀察美股變動、進行即時部位避險最重要的生存時段。" },
            { cat: "新手生存手冊", q: "歐大生存第一定律：新手想穩健起步，最推薦哪種策略？", options: ["裸賣 Call", "單邊重倉買 Put", "風險有限的價差策略(Spread)", "買入雙跨式"], ans: 2, exp: "歐大點評：價差策略（多頭/空頭價差）能鎖死最大虧損，讓新手在累積經驗時不會因一次失誤就重傷。" },
            { cat: "新手生存手冊", q: "交易稅的計算方式為何？(假設稅率為千分之一)", options: ["點數 × 50 × 0.001", "固定 10 元", "獲利才收", "由歐大代付"], ans: 0, exp: "歐大點評：政府收取契約總價值的千分之一。公式：成交點數 × 50元 × 0.1% = 應繳稅金。" },
            { cat: "新手生存手冊", q: "歐大建議：當你看不懂行情或感到猶豫時，最佳操作是？", options: ["加倍下注拼方向", "空手觀望", "上網看論壇跟單", "兩邊各買一張"], ans: 1, exp: "歐大點評：空手也是一種部位。保護本金是交易生涯的第一要務，看不懂就不下，市場永遠都在。" },
            { cat: "新手生存手冊", q: "對於「時間價值(Theta)」，新手應具備什麼正確心態？", options: ["買方適合長抱", "賣方是時間的莊家，利用盤整獲利", "兩者都沒有差別", "Theta 會自動變成內涵價值"], ans: 1, exp: "歐大點評：買方是跟時間賽跑，不宜久戰；賣方則是靠時間收租。理解這個敵我關係是生存的第一步。" },
            { cat: "新手生存手冊", q: "歐大強調的「期望值交易」概念是指？", options: ["追求單次暴利", "重複執行邏輯正確、長期獲利的模式", "只看勝率不看點數", "聽明牌下單"], ans: 1, exp: "歐大點評：穩定的交易者不看一兩次的輸贏。只要你的策略具備正期望值，重複執行，財富自然會隨機率而來。" },
            { cat: "新手生存手冊", q: "選擇權買方(Buyer)最理想的獲利條件為何？", options: ["緩步走揚", "橫盤死魚", "單邊劇烈大噴發或大跌", "溫和盤整"], ans: 2, exp: "歐大點評：買方需要波動。只有標的物劇烈移動，才能在短時間內彌補時間價值的損耗並產生暴利。" },
            { cat: "新手生存手冊", q: "最後一題：歐大選擇權教室的核心生存守則是什麼？", options: ["一夕致富", "理解規則、控管風險、長期生存", "打敗市場所有大戶", "預測明天幾點收盤"], ans: 1, exp: "歐大點評：交易是一場馬拉松。唯有理解規則、保護本金、留在場內，你才有機會見證機率帶來的豐厚果實！" }
        ];

        function App() {
            const [currentIdx, setCurrentIdx] = useState(0);
            const [selected, setSelected] = useState(null);
            const [showExp, setShowExp] = useState(false);
            const [score, setScore] = useState(0);
            const [isWrong, setIsWrong] = useState(false);
            const [quizDone, setQuizDone] = useState(false);
            const [bgColor, setBgColor] = useState('#F0A30A');

            const themes = [
                { bg: '#F0A30A', head: '#7FD8EE', btn: '#FFC62E' }, 
                { bg: '#7FD8EE', head: '#FFC62E', btn: '#FFFFFF' }, 
                { bg: '#3A35C4', head: '#7FD8EE', btn: '#FFC62E' }, 
                { bg: '#3A35C4', head: '#FFC62E', btn: '#7FD8EE' }, 
                { bg: '#FFC62E', head: '#7FD8EE', btn: '#FFFFFF' }  
            ];

            const setRandomTheme = () => {
                const randomTheme = themes[Math.floor(Math.random() * themes.length)];
                setBgColor(randomTheme.bg);
                document.documentElement.style.setProperty('--pop-bg', randomTheme.bg);
                document.documentElement.style.setProperty('--pop-header', randomTheme.head);
                document.documentElement.style.setProperty('--pop-btn', randomTheme.btn);
            };

            useEffect(() => {
                setRandomTheme();
            }, [currentIdx, quizDone]);

            const handleAnswer = (idx) => {
                if (showExp) return;
                setSelected(idx);
                setShowExp(true);
                
                if (idx === quizData[currentIdx].ans) {
                    setScore(prev => prev + 1);
                    setIsWrong(false);
                } else {
                    setIsWrong(true);
                    if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
                }
            };

            const next = () => {
                if (currentIdx < quizData.length - 1) {
                    setCurrentIdx(currentIdx + 1);
                    setSelected(null);
                    setShowExp(false);
                    setIsWrong(false);
                } else {
                    setQuizDone(true);
                }
            };

            const reset = () => {
                setCurrentIdx(0);
                setSelected(null);
                setShowExp(false);
                setScore(0);
                setIsWrong(false);
                setQuizDone(false);
            };

            const q = quizData[currentIdx];

            return (
                <div className="min-h-screen flex items-center justify-center fluid-padding" style={{backgroundColor: bgColor}}>
                    <div className="w-full max-w-4xl">
                        <header className="mb-8 transform rotate-[-2deg]">
                            <div className="bg-[var(--pop-header)] pop-card p-6 relative overflow-hidden">
                                <div className="absolute top-[-10px] right-[-10px] text-black opacity-10">
                                    <IconZap />
                                </div>
                                <h1 className="fluid-title font-[900] italic uppercase tracking-tighter leading-none text-black drop-shadow-md">
                                    歐大選擇權教室
                                </h1>
                                <div className="flex flex-wrap gap-2 mt-3">
                                    <span className="bg-black text-white px-4 py-1 font-black text-sm border-2 border-white skew-x-[-10deg]">
                                        進階生存戰 30 題
                                    </span>
                                </div>
                            </div>
                        </header>

                        {!quizDone ? (
                            <main className={isWrong ? 'animate-shake' : ''}>
                                <div className={`pop-card fluid-padding mb-8 transition-all duration-300 ${isWrong ? 'bg-[var(--pop-red)]' : 'bg-[var(--pop-card)]'}`}>
                                    <div className="flex justify-between items-center mb-6">
                                        <div className="flex items-center gap-2">
                                            <div className="bg-black text-white p-2 border-2 border-white rotate-[5deg]">
                                                <IconZap />
                                            </div>
                                            <span className={`font-[900] text-sm md:text-lg uppercase tracking-widest ${isWrong ? 'text-white' : 'bg-black text-white px-3'}`}>
                                                {q.cat}
                                            </span>
                                        </div>
                                        <div className={`font-[900] text-xl md:text-2xl ${isWrong ? 'text-white' : 'text-black'}`}>
                                            {currentIdx + 1} / 30
                                        </div>
                                    </div>

                                    <h2 className={`fluid-question font-[900] text-black leading-tight mb-10 ${isWrong ? 'text-white' : 'text-black'}`}>
                                        {q.q}
                                    </h2>

                                    <div className="grid grid-cols-1 gap-5">
                                        {q.options.map((opt, idx) => (
                                            <button
                                                key={idx}
                                                onClick={() => handleAnswer(idx)}
                                                disabled={showExp}
                                                className={`
                                                    btn-option-pill text-left p-4 md:p-6 font-[900] text-lg md:text-2xl flex items-center gap-6
                                                    ${showExp 
                                                        ? (idx === q.ans 
                                                            ? 'bg-[#0A7F4D] text-white scale-[1.03] z-10' 
                                                            : (selected === idx ? 'bg-black text-white border-white' : 'bg-gray-200 text-gray-400 opacity-50'))
                                                        : 'bg-[var(--pop-btn)] text-black hover:bg-[#7FD8EE]'
                                                    }
                                                `}
                                            >
                                                <span className="shrink-0 w-10 h-10 border-4 border-black bg-white flex items-center justify-center text-black font-[900] italic rounded-full">
                                                    {String.fromCharCode(65 + idx)}
                                                </span>
                                                {opt}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                {showExp && (
                                    <div className="pop-card bg-[#3A35C4] fluid-padding animate-in fade-in slide-in-from-bottom-6 duration-500 mb-28 relative transform rotate-[1deg]">
                                        <div className="absolute -top-6 left-12 bg-black text-[#FFC62E] px-6 py-1 font-[900] italic skew-x-[-15deg] border-4 border-white shadow-lg text-xl">
                                            歐大點評：
                                        </div>
                                        <div className="flex flex-col md:flex-row items-center md:items-start gap-8">
                                            <div className="shrink-0 bg-white border-4 border-black p-4 rotate-[-5deg]">
                                                {selected === q.ans ? <IconCheck className="text-[#0A7F4D]" /> : <IconX className="text-[#D9321F]" />}
                                            </div>
                                            <div className="flex-1 text-center md:text-left text-white">
                                                <p className="text-xl md:text-2xl font-[900] leading-snug mb-8">
                                                    {q.exp}
                                                </p>
                                                <button
                                                    onClick={next}
                                                    className="w-full md:w-auto bg-black text-[#FFC62E] px-12 py-4 font-[900] text-2xl btn-option-pill hover:bg-white hover:text-black uppercase italic tracking-widest"
                                                >
                                                    {currentIdx === quizData.length - 1 ? "看總結 RESULT" : "下一題 NEXT"}
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                )}
                            </main>
                        ) : (
                            <div className="pop-card bg-white fluid-padding text-center rotate-[1deg] mb-24 relative overflow-hidden">
                                <h2 className="text-4xl md:text-6xl font-[900] mb-8 uppercase italic tracking-tighter text-black text-center">
                                    特訓大成功！
                                </h2>
                                <div className="inline-block relative mb-12">
                                    <div className="absolute inset-0 bg-[#7FD8EE] translate-x-4 translate-y-4 border-4 border-black rounded-full"></div>
                                    <div className="relative bg-white border-8 border-black px-12 py-8 text-7xl md:text-9xl font-[900] text-[#D9321F] rounded-full leading-none flex items-baseline gap-2">
                                        {Math.round((score / quizData.length) * 100)}<span className="text-4xl md:text-5xl text-black">%</span>
                                    </div>
                                </div>
                                <p className="text-2xl md:text-4xl font-[900] mb-12 leading-tight text-black text-center">
                                    生存挑戰結業！
                                    <br />
                                    <span className="bg-yellow-400 border-4 border-black px-6 py-2 mt-8 inline-block shadow-[10px_10px_0px_0px_rgba(0,0,0,1)] rotate-[-2deg]">
                                        {score === 30 ? "🚀 傳奇莊家！市場再也沒有你的對手！" : (score >= 22 ? "🔥 高手！你已經看穿了所有的地雷！" : "🧘 再接再厲！細讀生存守則才能長久！")}
                                    </span>
                                </p>
                                <button
                                    onClick={reset}
                                    className="flex items-center gap-5 mx-auto bg-black text-white px-16 py-7 font-[900] text-3xl btn-option-pill hover:bg-[#0A7F4D] hover:text-black transition-all shadow-2xl"
                                >
                                    重新特訓 RETRY
                                </button>
                            </div>
                        )}

                        {!quizDone && (
                            <div className="fixed bottom-8 left-1/2 -translate-x-1/2 w-[90%] max-w-xl z-50">
                                <div className="flex items-center gap-6">
                                    <div className="flex-1 bg-white border-4 border-black h-12 shadow-[8px_8px_0px_0px_rgba(0,0,0,1)] relative overflow-hidden rounded-full">
                                        <div 
                                            className="h-full bg-[#D9321F] transition-all duration-700 border-r-4 border-black" 
                                            style={{ width: `${(currentIdx / quizData.length) * 100}%` }}
                                        ></div>
                                    </div>
                                    <div className="bg-black text-[#FFC62E] px-6 py-2 font-[900] border-4 border-white shadow-[8px_8px_0px_0px_rgba(0,0,0,1)] text-2xl rounded-xl">
                                        {score}
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
